<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>br-grama: como funciona o Estado brasileiro</title>
    <link rel="stylesheet" href="./src/estilo.css" />
  </head>
  <body>
    <div class="previa" role="note">
      <strong>Prévia.</strong> O esqueleto da Constituição está completo; o orçamento e as leis estruturantes estão em construção, e parte dos dados ainda está em verificação. Não use como referência oficial.
      <a href="https://github.com/dandesdev/br-grama" target="_blank" rel="noopener">Código e dados</a>
    </div>
    <header class="barra">
      <div class="marca">
        <strong>br-grama</strong>
        <span class="sub" id="data-referencia"></span>
      </div>
      <div class="busca">
        <input id="busca" type="search" placeholder="Buscar órgão ou cargo…" autocomplete="off" aria-label="Buscar órgão ou cargo" />
        <ul id="busca-resultados" role="listbox" hidden></ul>
      </div>
      <div class="camadas" role="group" aria-label="Camadas">
        <span class="rotulo">Relações</span>
        <label class="chave" title="Sem esta opção, as relações aparecem só ao clicar em um órgão ou cargo"><input type="checkbox" id="todas-relacoes" /> Todas</label>
        <details class="menu">
          <summary>Tipos</summary>
          <div id="filtro-grupos" class="grupos"></div>
        </details>
        <label class="processo">
          <span class="rotulo">Processo</span>
          <select id="processo"></select>
        </label>
        <label class="chave" title="Lacunas e divergências nas fontes oficiais"><input type="checkbox" id="avisos" /> Avisos</label>
        <label class="chave" title="Valor pago no último ano fechado: círculo com área proporcional"><input type="checkbox" id="orcamento" /> Orçamento</label>
      </div>
      <button id="tema" class="botao-icone" title="Alternar tema claro/escuro" aria-label="Alternar tema">◐</button>
    </header>
    <main>
      <div class="palco">
        <nav class="abas" role="tablist">
          <button role="tab" data-aba="mapa" aria-selected="true">Mapa</button>
          <button role="tab" data-aba="fluxo" id="aba-fluxo" aria-selected="false" disabled title="Escolha um processo">Fluxo do processo</button>
          <button role="tab" data-aba="matriz" aria-selected="false">Competências</button>
          <button role="tab" data-aba="dinheiro" aria-selected="false">Dinheiro</button>
        </nav>
        <div id="mapa" aria-label="Mapa do Estado brasileiro"></div>
        <div id="fluxo" aria-label="Fluxo do processo em raias" hidden></div>
        <div id="matriz" aria-label="Matriz de competências" hidden></div>
        <div id="dinheiro" aria-label="Orçamento executado e repasses" hidden></div>
      </div>
      <aside id="painel" aria-live="polite"></aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
